# CI for the versioned development crate (umbral/).
#
# Scope is deliberately minimal, matching the V0 workflow: fmt, clippy, tests. No release
# automation, packaging, coverage, dependency bots, containers, benchmarks or artifacts.
#
# This job runs on ubuntu-latest, whose ext4 filesystem is the third environment the suite is
# exercised on (tmpfs and btrfs are covered locally). That is not incidental: the frozen V0
# experiment's only deterministic CI failure came from a test that had encoded an assumption
# about filesystem behaviour, and running somewhere other than the development machine is how
# that class of defect is found. Assertions must hold on all three.
#
# Branches: `main` holds integrated state, and a version is developed on its own branch
# (`v0.2`). Both are listed so a version's development is actually verified while it happens
# rather than only once it is merged — a branch with no CI would make the ext4 signal
# unavailable for exactly the commits that need it. Add each new version branch explicitly;
# there is no glob here on purpose.

name: umbral

on:
  push:
    branches: [main, v0.2]
  pull_request:
    paths:
      - 'umbral/**'
      - 'Cargo.toml'
      - '.github/workflows/umbral.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: umbral
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-umbral-${{ hashFiles('umbral/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test
