# CI for the V0 prototype (fsp-check/), which is frozen experimental infrastructure.
#
# Scope is deliberately minimal: detect basic regressions in the prototype. No release
# automation, packaging, coverage, dependency bots, containers, benchmarks or artifacts.
#
# Layout note: a Cargo workspace DOES exist at the repository root since v0.1 (2026-09-12),
# and it deliberately EXCLUDES fsp-check/ so this crate keeps its own lockfile and target
# directory and builds exactly as it did when it was frozen. Every step still sets
# working-directory, because that is what keeps the two crates' builds independent.
# The exclusion is load-bearing: if fsp-check/ were a workspace member, this build would
# change. See the root Cargo.toml.
#
# Branches: the prototype is frozen, so this job exists as a regression guard rather than a
# development signal. It runs on the version branches as well as `main` so that an accidental
# change to fsp-check/ on a version branch is caught before it reaches `main`.

name: fsp-check

on:
  push:
    branches: [main, v0.2]
  pull_request:
    paths:
      - 'fsp-check/**'
      - '.github/workflows/fsp-check.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fsp-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fsp-check/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('fsp-check/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test
