name: Bug report
description: Something in the repository or in the V0 prototype behaves incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This project is an early research project with one frozen
        prototype (`fsp-check/`) and no released product. Please do not report security
        issues here — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you observed, and where (file, function, commit).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A command, a file tree, or a minimal fixture. Synthetic data only.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version tested
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, kernel, filesystem, toolchain versions.
    validations:
      required: false
