<rect x="410" y="106" width="308" height="128" fill="#6d28d9"/><rect x="402" y="98" width="308" height="128" fill="#ffffff" stroke="#000000" stroke-width="4"/>
<text x="422" y="126" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="800" fill="#6d28d9">[02]</text>
<text x="422" y="170" font-family="'Arial Black', 'Helvetica Neue', Arial, ui-sans-serif, sans-serif" font-size="28" font-weight="900" fill="#000000">DEJA CONTEXTO</text>
<text x="422" y="204" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#000000">Objetivo, fuentes y siguiente paso.</text>
