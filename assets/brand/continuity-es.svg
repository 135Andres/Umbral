<text x="788" y="170" font-family="'Arial Black', 'Helvetica Neue', Arial, ui-sans-serif, sans-serif" font-size="28" font-weight="900" fill="#ffffff">CONTINÚA</text>
<text x="788" y="204" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#ffffff">Con el mismo agente o con otro.</text>
