<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="312" viewBox="0 0 1120 312" role="img" aria-label="Continuidad entre agentes — recorrido propuesto">
<title>Continuidad entre agentes — recorrido propuesto</title>
<desc>Trabaja en tu herramienta de IA, deja contexto con referencias y continúa con el mismo agente o con otro. Diseño propuesto, aún no implementado.</desc>
<rect x="2" y="2" width="1116" height="308" fill="#ffffff" stroke="#000000" stroke-width="4"/>
<rect x="2" y="2" width="1116" height="22" fill="#6d28d9"/>
<text x="36" y="18" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="800" letter-spacing="3" fill="#ffffff">RECORRIDO PROPUESTO</text>
<text x="36" y="70" font-family="'Arial Black', 'Helvetica Neue', Arial, ui-sans-serif, sans-serif" font-size="26" font-weight="900" fill="#000000">UN PROYECTO. LA CONTINUIDAD ENTRE SESIONES.</text>
<rect x="44" y="106" width="308" height="128" fill="#6d28d9"/><rect x="36" y="98" width="308" height="128" fill="#ffffff" stroke="#000000" stroke-width="4"/>
<text x="56" y="126" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="800" fill="#6d28d9">[01]</text>
<text x="56" y="170" font-family="'Arial Black', 'Helvetica Neue', Arial, ui-sans-serif, sans-serif" font-size="28" font-weight="900" fill="#000000">TRABAJA</text>
<text x="56" y="204" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#000000">En tu herramienta de IA.</text>
