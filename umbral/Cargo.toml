[package]
name = "umbral"
version = "0.2.0"
edition = "2021"
description = "Umbral v0.1 — a local, read-only workspace observation instrument (development code; NOT the product architecture)"
publish = false
license = "GPL-3.0-or-later"

# Stack adopted for v0.1 ONLY (UD-014). Explicitly scoped, explicitly reversible, and
# explicitly NOT an inheritance from the V0 experiment or a product technology choice.
# `fsp-check/` remains independent and frozen.
[dependencies]
blake3 = "1.8.7"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# serde + serde_json: the `umbral-continuity/1` records only (UD-040).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# rustix (`fs`): continuity writes and reads relative to directory descriptors opened with
# O_NOFOLLOW, so a symlink swapped in mid-operation cannot redirect them (B-03, B-05).
# Already in Cargo.lock through tempfile; no new crate.
rustix = { version = "1.1.4", features = ["fs"] }
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
# Same crate and features as the runtime dependency, so this adds nothing to the build. It
# is listed so tests can deliberately corrupt a log and prove that `check` reports it —
# a test that cannot fail proves nothing.
rusqlite = { version = "0.40.2", features = ["bundled"] }
